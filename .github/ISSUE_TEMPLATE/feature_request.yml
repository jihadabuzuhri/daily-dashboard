name: Feature request
description: Suggest a new capability or an improvement to an existing one
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please search
        [existing issues](../?q=is%3Aissue) first in case it's already been proposed.

        This is a focused single-page dashboard built as vanilla JS on Vite, with no backend.
        Proposals that require a server, a new framework, or a large dependency are less likely to
        fit — but they're still worth discussing here first.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the need before the solution — the underlying problem often has a simpler fix than the first idea.
      placeholder: I lose track of which tasks are overdue because there's no way to record a due date.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like the app to do, and roughly how it would fit into the existing UI.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area does this affect?
      options:
        - Tasks
        - Today's Work (journal)
        - Team Lens
        - Quick Links / Saved for Later
        - Tags
        - Focus sessions
        - Sync and persistence
        - Theme and visual design
        - PWA / offline
        - Accessibility
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, including doing nothing.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a pull request for this
          required: false
